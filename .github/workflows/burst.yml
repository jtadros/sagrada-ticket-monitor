name: Sagrada Familia burst (every minute, 08:55-09:10 Cairo)

# 08:55-09:10 Africa/Cairo (UTC+3 in June) == 05:55-06:10 UTC.
# GitHub's scheduler only fires at ~5-min granularity and can be delayed, so we
# don't rely on a per-minute cron. Instead one job starts at 05:55 UTC and loops
# internally every 60s until 06:10 UTC — giving true 1-minute checks in the window.
on:
  schedule:
    - cron: "55 5 * * *"   # 08:55 Cairo
  workflow_dispatch: {}

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Per-minute checks until 06:10 UTC
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_MODE: ${{ vars.TEST_MODE || 'true' }}
        run: |
          end=$(date -u -d '06:10:30' +%s)   # stop just after 09:10 Cairo
          while [ "$(date -u +%s)" -le "$end" ]; do
            python3 sagrada_familia_monitor.py --once || true
            now=$(date -u +%s)
            [ "$now" -le "$end" ] && sleep 60
          done
