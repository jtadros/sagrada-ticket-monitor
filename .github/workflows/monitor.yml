name: Sagrada Familia ticket monitor

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC; GitHub may delay a few minutes under load)
  workflow_dispatch: {}      # allows manual "Run workflow" button for testing

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check availability and notify
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          TEST_MODE: ${{ vars.TEST_MODE || 'true' }}
        run: python3 sagrada_familia_monitor.py --once
